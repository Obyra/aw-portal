<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Windbrook Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#1B4F8C; --blue-light:#2E6DB4; --blue-pale:#EBF2FA;
    --gray:#F5F6F8; --gray-med:#E2E5EA; --gray-dark:#6B7280;
    --dark:#111827; --white:#fff;
    --shadow-lg:0 20px 60px rgba(27,79,140,.18), 0 4px 12px rgba(0,0,0,.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'DM Sans',sans-serif; color:var(--dark);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#1B4F8C 0%,#2E6DB4 60%,#3a82d1 100%);
    padding:24px;
  }
  .card {
    background:white; border-radius:18px; box-shadow:var(--shadow-lg);
    width:100%; max-width:420px; padding:44px 40px 36px;
  }
  .brand { text-align:center; margin-bottom:28px; }
  .brand-title { font-family:'DM Serif Display',serif; font-size:26px; color:var(--blue); letter-spacing:.3px; }
  .brand-sub { font-size:13px; color:var(--gray-dark); margin-top:4px; letter-spacing:.4px; }
  .title { font-family:'DM Serif Display',serif; font-size:22px; color:var(--dark); margin-bottom:6px; }
  .subtitle { font-size:13px; color:var(--gray-dark); margin-bottom:24px; }

  .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  label { font-size:12px; font-weight:600; color:var(--gray-dark); text-transform:uppercase; letter-spacing:.5px; }
  input { padding:11px 14px; border:1.5px solid var(--gray-med); border-radius:9px; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--dark); background:white; transition:.15s; }
  input:focus { outline:none; border-color:var(--blue-light); box-shadow:0 0 0 3px rgba(46,109,180,.15); }

  .btn-primary {
    width:100%; background:var(--blue); color:white; border:none;
    padding:13px 22px; border-radius:9px; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700;
    letter-spacing:.3px; transition:.2s; margin-top:8px;
  }
  .btn-primary:hover { background:var(--blue-light); box-shadow:0 6px 20px rgba(46,109,180,.35); }

  .error {
    background:#FEF2F2; color:#991B1B; border:1px solid #FECACA;
    padding:11px 14px; border-radius:9px; font-size:13px;
    font-weight:600; margin-bottom:16px;
  }
  .footer {
    text-align:center; font-size:11px; color:var(--gray-dark);
    margin-top:24px; padding-top:18px; border-top:1px solid var(--gray-med);
    letter-spacing:.3px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-title">Windbrook Solutions</div>
    <div class="brand-sub">Client Report Portal</div>
  </div>

  <div class="title">Sign in</div>
  <div class="subtitle">Use your team credentials to continue.</div>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" autocomplete="off">
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" autofocus required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-primary">Sign in</button>
  </form>

  <div class="footer">Internal use only · Confidential</div>
</div>
</body>
</html>
