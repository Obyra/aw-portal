<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied — Windbrook Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:#F0F3F8; color:#111827; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:white; border-radius:18px; padding:48px 44px; box-shadow:0 8px 24px rgba(0,0,0,.08); text-align:center; max-width:460px; }
  .icon { width:64px; height:64px; border-radius:50%; background:#FEF2F2; color:#991B1B; font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-weight:700; }
  h1 { font-family:'DM Serif Display',serif; font-size:26px; margin-bottom:8px; }
  p { color:#6B7280; font-size:14px; margin-bottom:22px; line-height:1.5; }
  .btn { display:inline-block; background:#1B4F8C; color:white; padding:11px 22px; border-radius:9px; font-weight:700; text-decoration:none; font-size:14px; transition:.2s; }
  .btn:hover { background:#2E6DB4; }
  .role-note { font-size:12px; color:#6B7280; margin-top:18px; }
  .role-note strong { color:#111827; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">⛔</div>
  <h1>Access Denied</h1>
  <p>You don't have permission to view this page. This area is restricted to administrators.</p>
  <a href="/" class="btn">Back to Dashboard</a>
  {% if current_user %}
  <div class="role-note">
    Signed in as <strong>{{ current_user.full_name }}</strong> ({{ current_user.role }})
  </div>
  {% endif %}
</div>
</body>
</html>
