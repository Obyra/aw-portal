<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ 'Edit' if client_id else 'New' }} Client — AW Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root { --blue:#1B4F8C; --blue-light:#2E6DB4; --blue-pale:#EBF2FA; --green:#2D7A3A; --gray:#F5F6F8; --gray-med:#E2E5EA; --gray-dark:#6B7280; --dark:#111827; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06); --radius:12px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:#F0F3F8; color:var(--dark); }
  nav { background:var(--blue); padding:0 40px; height:60px; display:flex; align-items:center; gap:16px; }
  .nav-back { color:rgba(255,255,255,.7); text-decoration:none; font-size:13px; display:flex; align-items:center; gap:6px; }
  .nav-back:hover { color:white; }
  .nav-brand { color:white; font-family:'DM Serif Display',serif; font-size:18px; }
  .container { max-width:760px; margin:0 auto; padding:40px 24px; }
  .page-title { font-family:'DM Serif Display',serif; font-size:26px; margin-bottom:28px; }

  .card { background:white; border-radius:var(--radius); padding:28px 32px; box-shadow:var(--shadow); margin-bottom:20px; }
  .card-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--blue); margin-bottom:20px; padding-bottom:12px; border-bottom:1.5px solid var(--gray-med); }

  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .form-grid.three { grid-template-columns:1fr 1fr 1fr; }
  .full { grid-column:1/-1; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  label { font-size:12px; font-weight:600; color:var(--gray-dark); text-transform:uppercase; letter-spacing:.5px; }
  input, select { padding:10px 14px; border:1.5px solid var(--gray-med); border-radius:8px; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--dark); background:white; transition:.15s; }
  input:focus, select:focus { outline:none; border-color:var(--blue-light); box-shadow:0 0 0 3px rgba(46,109,180,.12); }

  /* Dynamic sections */
  .dynamic-section { margin-top:12px; }
  .account-row { display:grid; gap:10px; align-items:end; margin-bottom:10px; padding:14px; background:var(--gray); border-radius:8px; }
  .account-row.ret { grid-template-columns:2fr 2fr 1fr auto; }
  .account-row.nret { grid-template-columns:2fr 2fr auto; }
  .account-row.liab { grid-template-columns:2fr 1fr 1fr auto; }
  .btn-remove { background:#FEE2E2; color:#991B1B; border:none; width:32px; height:32px; border-radius:6px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; align-self:end; }
  .btn-add { background:var(--blue-pale); color:var(--blue); border:1.5px dashed var(--blue-light); padding:9px 16px; border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; margin-top:8px; width:100%; transition:.15s; }
  .btn-add:hover { background:var(--blue); color:white; }

  .actions { display:flex; gap:12px; margin-top:12px; }
  .btn-primary { background:var(--blue); color:white; border:none; padding:12px 28px; border-radius:9px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; transition:.2s; }
  .btn-primary:hover { background:var(--blue-light); }
  .btn-cancel { background:transparent; color:var(--gray-dark); border:1.5px solid var(--gray-med); padding:12px 24px; border-radius:9px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; }
  .toast { position:fixed; top:20px; right:20px; background:#166534; color:white; padding:14px 22px; border-radius:10px; font-weight:600; font-size:14px; display:none; z-index:999; }
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-back">← Back</a>
  <div class="nav-brand">Windbrook Solutions</div>
</nav>
<div class="toast" id="toast">✓ Client saved successfully!</div>
<div class="container">
  <div class="page-title">{{ 'Edit Client' if client_id else 'New Client' }}</div>

  <!-- Basic Info -->
  <div class="card">
    <div class="card-title">Client Information</div>
    <div class="form-grid">
      <div class="form-group"><label>First Name (Client 1)</label><input id="name1" value="{{ client.name1 if client else '' }}" placeholder="James"></div>
      <div class="form-group"><label>Last Name</label><input id="last_name" value="{{ client.last_name if client else '' }}" placeholder="Patterson"></div>
      <div class="form-group"><label>Date of Birth</label><input id="dob1" type="date" value="{{ client.dob1 if client else '' }}"></div>
      <div class="form-group"><label>Last 4 SSN</label><input id="ssn1" maxlength="4" value="{{ client.ssn1 if client else '' }}" placeholder="4821"></div>
      <div class="form-group"><label>First Name (Spouse / Client 2)</label><input id="name2" value="{{ client.name2 if client else '' }}" placeholder="Sarah (optional)"></div>
      <div class="form-group"><label>Date of Birth (Spouse)</label><input id="dob2" type="date" value="{{ client.dob2 if client else '' }}"></div>
      <div class="form-group"><label>Last 4 SSN (Spouse)</label><input id="ssn2" maxlength="4" value="{{ client.ssn2 if client else '' }}" placeholder="3094"></div>
    </div>
  </div>

  <!-- Financial -->
  <div class="card">
    <div class="card-title">Static Financial Data</div>
    <div class="form-grid three">
      <div class="form-group"><label>Monthly Inflow (after tax)</label><input id="monthly_inflow" type="number" value="{{ client.monthly_inflow if client else '' }}" placeholder="15000"></div>
      <div class="form-group"><label>Monthly Outflow (budget)</label><input id="monthly_outflow" type="number" value="{{ client.monthly_outflow if client else '' }}" placeholder="11000"></div>
      <div class="form-group"><label>Insurance Deductibles (total)</label><input id="insurance_deductibles" type="number" value="{{ client.insurance_deductibles if client else '' }}" placeholder="3500"></div>
    </div>
  </div>

  <!-- Retirement Accounts -->
  <div class="card">
    <div class="card-title">Retirement Accounts</div>
    <div class="dynamic-section" id="ret-list"></div>
    <button class="btn-add" onclick="addRet()">+ Add Retirement Account</button>
  </div>

  <!-- Non-Retirement Accounts -->
  <div class="card">
    <div class="card-title">Non-Retirement Accounts</div>
    <div class="dynamic-section" id="nret-list"></div>
    <button class="btn-add" onclick="addNret()">+ Add Non-Retirement Account</button>
  </div>

  <!-- Trust -->
  <div class="card">
    <div class="card-title">Trust / Property</div>
    <div class="form-group"><label>Property Address (for Zillow lookup)</label><input id="trust_address" value="{{ client.trust.address if client and client.trust else '' }}" placeholder="1420 Peachtree Rd NE, Atlanta, GA"></div>
  </div>

  <!-- Liabilities -->
  <div class="card">
    <div class="card-title">Liabilities</div>
    <div class="dynamic-section" id="liab-list"></div>
    <button class="btn-add" onclick="addLiab()">+ Add Liability</button>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="saveClient()">Save Client</button>
    <a href="/" class="btn-cancel">Cancel</a>
  </div>
</div>

<script>
const existing = {{ client | tojson if client else 'null' }};
const clientId = {{ client_id | tojson if client_id else 'null' }};

let retAccounts = existing?.retirement_accounts || [];
let nretAccounts = existing?.non_retirement_accounts || [];
let liabAccounts = existing?.liabilities || [];

function renderRet() {
  document.getElementById('ret-list').innerHTML = retAccounts.map((a, i) => `
    <div class="account-row ret">
      <div class="form-group"><label>Account Type</label>
        <select onchange="retAccounts[${i}].type=this.value">
          ${['IRA','Roth IRA','401K','Pension','403b'].map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
      <div class="form-group"><label>Owner</label>
        <select onchange="retAccounts[${i}].owner=this.value">
          <option value="client1" ${a.owner==='client1'?'selected':''}>Client 1</option>
          <option value="client2" ${a.owner==='client2'?'selected':''}>Client 2</option>
        </select></div>
      <div class="form-group"><label>Last 4</label><input maxlength="4" value="${a.last4||''}" oninput="retAccounts[${i}].last4=this.value" placeholder="2241"></div>
      <button class="btn-remove" onclick="retAccounts.splice(${i},1);renderRet()">✕</button>
    </div>`).join('');
}
function addRet() { retAccounts.push({type:'IRA',owner:'client1',last4:''}); renderRet(); }

function renderNret() {
  document.getElementById('nret-list').innerHTML = nretAccounts.map((a, i) => `
    <div class="account-row nret">
      <div class="form-group"><label>Account Type</label>
        <select onchange="nretAccounts[${i}].type=this.value">
          ${['Schwab Brokerage','Joint Brokerage','Individual Brokerage','Money Market'].map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
      <div class="form-group"><label>Last 4</label><input maxlength="4" value="${a.last4||''}" oninput="nretAccounts[${i}].last4=this.value" placeholder="7743"></div>
      <button class="btn-remove" onclick="nretAccounts.splice(${i},1);renderNret()">✕</button>
    </div>`).join('');
}
function addNret() { nretAccounts.push({type:'Schwab Brokerage',last4:''}); renderNret(); }

function renderLiab() {
  document.getElementById('liab-list').innerHTML = liabAccounts.map((a, i) => `
    <div class="account-row liab">
      <div class="form-group"><label>Type</label>
        <select onchange="liabAccounts[${i}].type=this.value">
          ${['Mortgage','Auto Loan','Home Equity','Student Loan'].map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
      <div class="form-group"><label>Interest Rate %</label><input type="number" step="0.01" value="${a.rate||''}" oninput="liabAccounts[${i}].rate=parseFloat(this.value)" placeholder="3.25"></div>
      <div class="form-group"><label>Last 4</label><input maxlength="4" value="${a.last4||''}" oninput="liabAccounts[${i}].last4=this.value" placeholder="9921"></div>
      <button class="btn-remove" onclick="liabAccounts.splice(${i},1);renderLiab()">✕</button>
    </div>`).join('');
}
function addLiab() { liabAccounts.push({type:'Mortgage',rate:'',last4:''}); renderLiab(); }

renderRet(); renderNret(); renderLiab();

async function saveClient() {
  const data = {
    name1: document.getElementById('name1').value,
    name2: document.getElementById('name2').value,
    last_name: document.getElementById('last_name').value,
    dob1: document.getElementById('dob1').value,
    dob2: document.getElementById('dob2').value,
    ssn1: document.getElementById('ssn1').value,
    ssn2: document.getElementById('ssn2').value,
    monthly_inflow: parseFloat(document.getElementById('monthly_inflow').value) || 0,
    monthly_outflow: parseFloat(document.getElementById('monthly_outflow').value) || 0,
    insurance_deductibles: parseFloat(document.getElementById('insurance_deductibles').value) || 0,
    retirement_accounts: retAccounts,
    non_retirement_accounts: nretAccounts,
    trust: { address: document.getElementById('trust_address').value },
    liabilities: liabAccounts
  };
  const url = clientId ? `/client/${clientId}/edit` : '/client/new';
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
  const j = await res.json();
  if (j.ok) {
    document.getElementById('toast').style.display='block';
    setTimeout(() => window.location.href='/', 1200);
  }
}
</script>
</body>
</html>
